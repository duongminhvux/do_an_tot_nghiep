name: vocalearn-clean
services:
  mongo:
    image: mongo:8.0
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand("ping").ok
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - toeic-network
  # Initialize rs0 or additively reconcile service databases against the manifest.
  # A schema change rebuilds this one-shot image; no legacy import on startup.
  db-init:
    image: vocalearn-clean-db-init:local
    pull_policy: never
    build:
      context: .
      dockerfile: database/Dockerfile
      provenance: false
      sbom: false
    entrypoint: ["mongosh"]
    command: ["--norc", "--quiet", "mongodb://mongo:27017/?directConnection=true", "--file", "/bootstrap/init.js"]
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - toeic-network
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - toeic-network
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/99-consumer.conf:ro
    ports:
      - 127.0.0.1:15672:15672
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - toeic-network
  # S3-compatible SeaweedFS (MinIO images unavailable since Sep 2026).
  objectstore:
    image: chrislusf/seaweedfs:4.30
    command:
      - mini
      - -dir=/data
      - -s3.port=9000
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-vocalearn-media}
    volumes:
      - objectstore_data:/data
    ports:
      - 127.0.0.1:9000:9000
    networks:
      - toeic-network
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:9000/readyz
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  # Idempotent admin seed: after db-init, before identity-service.
  # Disabled by default. Never overwrites an existing password on restart.
  admin-seed:
    image: vocalearn-clean-api:local
    pull_policy: never
    command: ["node", "apps/api/src/scripts/seed-admin.mjs", "--auto"]
    restart: "no"
    environment:
      MONGO_URI: ${MONGO_IDENTITY_URI:-mongodb://mongo:27017/identity_db?replicaSet=rs0}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@gmail.com}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-false}
      ADMIN_SEED_ALLOW_WEAK_PASSWORD: ${ADMIN_SEED_ALLOW_WEAK_PASSWORD:-false}
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - toeic-network
  identity-service:
    image: vocalearn-clean-api:local
    pull_policy: never
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      provenance: false
      sbom: false
    command:
      - node
      - apps/api/dist/entrypoints/identity.js
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '5000'
      MONGO_URI: ${MONGO_IDENTITY_URI:-mongodb://mongo:27017/identity_db?replicaSet=rs0}
      REDIS_URL: redis://redis:6379
      MEDIA_STORAGE_BACKEND: s3
      MEDIA_BRIDGE_URL: http://media-bridge:8010
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:?Set MEDIA_INTERNAL_TOKEN}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:5000/media}
      MEDIA_STORAGE_PATH: /app/storage
      AUDIO_QUEUE_BACKEND: rabbitmq
      RABBIT_JOB_BROKER_URL: http://job-broker:8020
      JOB_INTERNAL_TOKEN: ${JOB_INTERNAL_TOKEN:?Set JOB_INTERNAL_TOKEN}
      ASR_JOB_API_URL: http://asr-job-api:8021
      IDENTITY_INTROSPECTION_URL: http://identity-service:5000/api/_internal/identity/introspect
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:?Set IDENTITY_INTERNAL_TOKEN}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-15m}
      JWT_REFRESH_TOKEN_EXPIRES: ${JWT_REFRESH_TOKEN_EXPIRES:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:5000/api/auth/google/callback}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Daily English}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      TTS_SERVICE_URL: http://tts-service:8001
      ASR_SERVICE_URL: http://asr-service:8002
      PDF_AI_URL: http://pdf-ai:8003
      VOCAB_TTS_US_VOICE: ${VOCAB_TTS_US_VOICE:-af_heart}
      VOCAB_TTS_UK_VOICE: ${VOCAB_TTS_UK_VOICE:-bf_emma}
      VOCAB_TTS_SPEED: ${VOCAB_TTS_SPEED:-1}
      TOEIC_TTS_SPEED: ${TOEIC_TTS_SPEED:-1}
      CONTENT_INTERNAL_URL: http://content-service:5000
      ASSESSMENT_INTERNAL_URL: http://assessment-service:5000
      SERVICE_ROLE: identity
      MONGO_DB_NAME: identity_db
      NOTIFICATION_INTERNAL_URL: http://notification-service:5000
    volumes:
      - ./storage:/app/storage:ro
    depends_on:
      admin-seed:
