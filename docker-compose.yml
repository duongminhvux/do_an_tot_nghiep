# PostgreSQL only. Configuration and service secrets come from ROOT .env.
name: vocalearn-postgres
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:-vocalearn_root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PG_IDENTITY_PASSWORD: ${PG_IDENTITY_PASSWORD:?Set service password}
      PG_CONTENT_PASSWORD: ${PG_CONTENT_PASSWORD:?Set service password}
      PG_ASSESSMENT_PASSWORD: ${PG_ASSESSMENT_PASSWORD:?Set service password}
      PG_ARENA_PASSWORD: ${PG_ARENA_PASSWORD:?Set service password}
      PG_LEARNING_PASSWORD: ${PG_LEARNING_PASSWORD:?Set service password}
      PG_MEDIA_PASSWORD: ${PG_MEDIA_PASSWORD:?Set service password}
      PG_AI_IMPORT_PASSWORD: ${PG_AI_IMPORT_PASSWORD:?Set service password}
      PG_NOTIFICATION_PASSWORD: ${PG_NOTIFICATION_PASSWORD:?Set service password}
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./database/postgres/01-init.sql:/opt/vocalearn-bootstrap/01-init.sql:ro
    - ./database/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 15s
    networks:
    - toeic-network
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --appendfsync
    - everysec
    restart: unless-stopped
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
    - toeic-network
    environment: {}
    ports:
    - 127.0.0.1:6379:6379
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/99-consumer.conf:ro
    ports:
    - 127.0.0.1:15672:15672
    - 127.0.0.1:5672:5672
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
    - toeic-network
  objectstore:
    image: chrislusf/seaweedfs:4.30
    command:
    - mini
    - -dir=/data
    - -s3.port=9000
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-vocalearn-media}
    volumes:
    - objectstore_data:/data
    ports:
    - 127.0.0.1:9000:9000
    networks:
    - toeic-network
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:9000/readyz
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  schema-migrate:
    image: vocalearn-clean-api:local
    pull_policy: never
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      provenance: false
      sbom: false
    command: ["node", "scripts/migrate.mjs", "--all"]
    restart: "no"
    environment:
      NODE_ENV: production
      PGHOST: postgres
      PGPORT: "5432"
      PG_IDENTITY_PASSWORD: ${PG_IDENTITY_PASSWORD:?Set service PG password}
      PG_CONTENT_PASSWORD: ${PG_CONTENT_PASSWORD:?Set service PG password}
      PG_ASSESSMENT_PASSWORD: ${PG_ASSESSMENT_PASSWORD:?Set service PG password}
      PG_ARENA_PASSWORD: ${PG_ARENA_PASSWORD:?Set service PG password}
      PG_LEARNING_PASSWORD: ${PG_LEARNING_PASSWORD:?Set service PG password}
      PG_MEDIA_PASSWORD: ${PG_MEDIA_PASSWORD:?Set service PG password}
      PG_AI_IMPORT_PASSWORD: ${PG_AI_IMPORT_PASSWORD:?Set service PG password}
      PG_NOTIFICATION_PASSWORD: ${PG_NOTIFICATION_PASSWORD:?Set service PG password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - toeic-network
  admin-seed:
    image: vocalearn-clean-api:local
    pull_policy: never
    command:
    - node
    - apps/api/src/scripts/seed-admin.mjs
    - --auto
    restart: 'no'
    environment:
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@gmail.com}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-false}
      ADMIN_SEED_ALLOW_WEAK_PASSWORD: ${ADMIN_SEED_ALLOW_WEAK_PASSWORD:-false}
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: identity_db
      PGUSER: vl_identity
      PGPASSWORD: ${PG_IDENTITY_PASSWORD:?Set service PG password}
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
    - toeic-network
  identity-service:
    image: vocalearn-clean-api:local
    pull_policy: never
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      provenance: false
      sbom: false
    command:
    - node
    - apps/api/dist/entrypoints/identity.js
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '5000'
      REDIS_URL: redis://redis:6379
      MEDIA_STORAGE_BACKEND: s3
      MEDIA_BRIDGE_URL: http://media-bridge:8010
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:?Set MEDIA_INTERNAL_TOKEN}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:5000/media}
      MEDIA_STORAGE_PATH: /app/storage
      AUDIO_QUEUE_BACKEND: rabbitmq
      RABBIT_JOB_BROKER_URL: http://job-broker:8020
      JOB_INTERNAL_TOKEN: ${JOB_INTERNAL_TOKEN:?Set JOB_INTERNAL_TOKEN}
      ASR_JOB_API_URL: http://asr-job-api:8021
      IDENTITY_INTROSPECTION_URL: http://identity-service:5000/api/_internal/identity/introspect
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:?Set IDENTITY_INTERNAL_TOKEN}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-15m}
      JWT_REFRESH_TOKEN_EXPIRES: ${JWT_REFRESH_TOKEN_EXPIRES:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:5000/api/auth/google/callback}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
