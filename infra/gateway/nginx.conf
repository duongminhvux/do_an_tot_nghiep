worker_processes auto;
events { worker_connections 2048; }
http {
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr '
                     'request_time=$request_time upstream_time=$upstream_response_time';
  access_log /dev/stdout upstream;
  error_log /dev/stderr warn;

  upstream identity { server identity-service:5000; }
  upstream content { server content-service:5000; }
  upstream assessment { server assessment-service:5000; }
  upstream arena { server arena-service:5000; }
  upstream learning { server learning-service:5000; }
  upstream media_jobs { server media-jobs-service:5000; }
  upstream ai_import { server ai-import-service:5000; }
  upstream notification { server notification-service:5000; }
  upstream legacy { server api:5000; }

  server {
    listen 5000;
    client_max_body_size 110m;
    proxy_connect_timeout 8s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location = /gateway/health { default_type application/json; return 200 '{"status":"ok","gateway":"nginx"}'; }
    location ^~ /socket.io/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_pass http://arena;
    }
    # Exact regex routes must come before generic admin/exams handling.
    location ~ ^/api/admin/exams/[^/]+/pdf-ai(?:/|$) { proxy_pass http://ai_import; }
    location ~ ^/api/admin/pdf-ai(?:/|$) { proxy_pass http://ai_import; }
    location ~ ^/api/(?:auth|admin/auth|users|admin/users)(?:/|$) { proxy_pass http://identity; }
    location ~ ^/api/(?:words|admin/words|collections|admin/collections|lessons|admin/lessons|vocabulary-groups|admin/vocabulary-groups|dictation|admin/dictation|upload)(?:/|$) { proxy_pass http://content; }
    location ~ ^/api/(?:exams|admin/exams|exam-groups|admin/exam-groups|admin/questions|attempts)(?:/|$) { proxy_pass http://assessment; }
    location ~ ^/api/(?:arena|admin/arena)(?:/|$) { proxy_pass http://arena; }
    location ~ ^/api/(?:learning|progress|reviews|admin/dashboard|minigames|admin/minigames|admin/games)(?:/|$) { proxy_pass http://learning; }
    location ~ ^/api/(?:admin/audio|admin/asr|admin/infrastructure|tts)(?:/|$) { proxy_pass http://media_jobs; }
    location ~ ^/api/(?:activity-logs|admin/activity-logs)(?:/|$) { proxy_pass http://notification; }
    location ^~ /media/ { proxy_pass http://legacy; }
    # Baseline API continues handling as-yet-unmigrated endpoints.
    location / { proxy_pass http://legacy; }
  }
}
