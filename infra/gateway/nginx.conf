worker_processes auto;
events { worker_connections 2048; }
http {
  server_tokens off;
  # Docker embedded DNS: refresh container IPs after compose recreate/redeploy.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Origin ports are loopback-only; edge/cloudflared are trusted peers.
  map $http_x_forwarded_proto $forwarded_proto { default $scheme; http http; https https; }
  access_log /dev/stdout;
  error_log /dev/stderr warn;


  server {
    listen 5000;
    client_max_body_size 110m;
    proxy_connect_timeout 8s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-Id $request_id;
    location = /gateway/health { default_type application/json; return 200 '{"status":"ok","gateway":"nginx"}'; }
    location = /api/health { default_type application/json; return 200 '{"status":"ok","gateway":"nginx"}'; }
    # Distinguish the gateway's own health from backend health.
    location = /gateway/identity-health { set $service_target identity-service:5000; proxy_pass http://$service_target/api/health; }
    location = /gateway/notification-health { set $service_target notification-service:5000; proxy_pass http://$service_target/api/health; }
    # Readiness probes must reach each upstream, not just Nginx's static health.
    # They are intentionally separate: a single gateway 200 cannot guarantee
    # that every business service and its database are healthy.
    location = /gateway/identity-ready { set $service_target identity-service:5000; proxy_pass http://$service_target/api/health/ready; }
    location = /gateway/content-ready { set $service_target content-service:5000; proxy_pass http://$service_target/api/health/ready; }
    location = /gateway/assessment-ready { set $service_target assessment-service:5000; proxy_pass http://$service_target/api/health/ready; }
    location = /gateway/arena-ready { set $service_target arena-service:5000; proxy_pass http://$service_target/api/health/ready; }
    location = /gateway/learning-ready { set $service_target learning-service:5000; proxy_pass http://$service_target/api/health/ready; }
    location = /gateway/media-jobs-ready { set $service_target media-jobs-service:5000; proxy_pass http://$service_target/api/health/ready; }
    location = /gateway/ai-import-ready { set $service_target ai-import-service:5000; proxy_pass http://$service_target/api/health/ready; }
    location = /gateway/notification-ready { set $service_target notification-service:5000; proxy_pass http://$service_target/api/health/ready; }
    # SECURITY: private APIs are only reachable over the Docker network.
    location = /api/_internal { return 404; }
    location ^~ /api/_internal/ { return 404; }
    location ^~ /socket.io/ {
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      set $service_target arena-service:5000; proxy_pass http://$service_target$request_uri;
    }
    location ^~ /media/ { set $service_target media-jobs-service:5000; proxy_pass http://$service_target$request_uri; }
    location ~ ^/api/admin/exams/[^/]+/pdf-ai(?:/|$) { set $service_target ai-import-service:5000; proxy_pass http://$service_target$request_uri; }
    location ~ ^/api/(?:admin/pdf-ai|pdf-ai)(?:/|$) { set $service_target ai-import-service:5000; proxy_pass http://$service_target$request_uri; }
    location ~ ^/api/(?:auth|admin/auth|users|admin/users)(?:/|$) { set $service_target identity-service:5000; proxy_pass http://$service_target$request_uri; }
    location ~ ^/api/(?:words|admin/words|collections|admin/collections|lessons|admin/lessons|vocabulary-groups|admin/vocabulary-groups|dictation|admin/dictation|upload)(?:/|$) { set $service_target content-service:5000; proxy_pass http://$service_target$request_uri; }
    location ~ ^/api/(?:exams|admin/exams|exam-groups|admin/exam-groups|admin/questions|attempts|admin/attempts)(?:/|$) { set $service_target assessment-service:5000; proxy_pass http://$service_target$request_uri; }
    location ~ ^/api/(?:arena|admin/arena)(?:/|$) { set $service_target arena-service:5000; proxy_pass http://$service_target$request_uri; }
    location ~ ^/api/(?:learning|learning-activity|progress|reviews|sessions|admin/learning|admin/dashboard|minigames|admin/minigames|admin/games)(?:/|$) { set $service_target learning-service:5000; proxy_pass http://$service_target$request_uri; }
    location ~ ^/api/(?:site-settings|admin/site-settings|admin/audio|admin/asr|admin/infrastructure|tts|asr)(?:/|$) { set $service_target media-jobs-service:5000; proxy_pass http://$service_target$request_uri; }
    location ~ ^/api/(?:activity-logs|admin/activity-logs)(?:/|$) { set $service_target notification-service:5000; proxy_pass http://$service_target$request_uri; }
    # No legacy fallback. Unknown routes fail closed rather than hitting the monolith.
    location / { return 404; }
  }
}
