# Overlay on docker-compose.yml + docker-compose.ai.yml.
services:
  ollama-model-init:
    image: ollama/ollama:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        i=0;
        until ollama list >/dev/null 2>&1; do
          i=$$((i+1));
          if [ "$$i" -gt 60 ]; then echo "Ollama is not ready" >&2; exit 1; fi;
          sleep 2;
        done;
        ollama list | grep -F -- "$$OLLAMA_MODEL" ||
        ( [ "$$MODEL_AUTO_DOWNLOAD" = "true" ] && ollama pull "$$OLLAMA_MODEL" )
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      MODEL_AUTO_DOWNLOAD: ${MODEL_AUTO_DOWNLOAD:-true}
    depends_on: [ollama]
    networks: [toeic-network]
  pdf-ai:
    depends_on:
      ollama-model-init: {condition: service_completed_successfully}
