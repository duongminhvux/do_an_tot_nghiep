# Optional second inference instance. Provision separately; admission is fail-closed.
# Requires docker-compose.yml + infra/compose/rabbitmq.yml + GPU runtime.
services:
  tts-service-elastic:
    build:
      context: .
      dockerfile: services/tts-service/Dockerfile
      args:
        TORCH_VERSION: ${TORCH_VERSION:-2.7.1}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL_GPU:-https://download.pytorch.org/whl/cu126}
    restart: unless-stopped
    environment:
      KOKORO_DEVICE: cuda
      KOKORO_MODEL_ID: ${KOKORO_MODEL_ID:-hexgrad/Kokoro-82M}
      HF_HOME: /models/huggingface
    volumes:
      - kokoro_models:/models/huggingface
    gpus: all
    networks: [toeic-network]

  audio-worker-elastic:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/audio-worker-main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/_internal/audio/health').then(r => process.exit(r.ok ? 0 : 1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUDIO_QUEUE_BACKEND: rabbitmq
      MONGO_URI: ${DOCKER_MONGO_URI:-mongodb://mongo:27017/english-platform}
      REDIS_URL: redis://redis:6379
      JOB_INTERNAL_TOKEN: ${JOB_INTERNAL_TOKEN:?Set JOB_INTERNAL_TOKEN}
      TTS_SERVICE_URL: http://tts-service-elastic:8001
      MEDIA_STORAGE_PATH: /app/storage
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:5000/media}
      MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-local}
      MEDIA_BRIDGE_URL: http://media-bridge:8010
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:-}
    volumes:
      - ./storage:/app/storage
    depends_on:
      tts-service-elastic: {condition: service_started}
      redis: {condition: service_healthy}
      db-migrate: {condition: service_completed_successfully}
    networks: [toeic-network]

  job-runner-elastic:
    build:
      context: .
      dockerfile: services/job-broker/Dockerfile.runner
    restart: unless-stopped
    environment:
      RUNNER_ROLE: elastic
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL}
      REDIS_URL: redis://redis:6379
      JOB_INTERNAL_TOKEN: ${JOB_INTERNAL_TOKEN:?Set JOB_INTERNAL_TOKEN}
      AUDIO_WORKER_URL: http://audio-worker-elastic:5001
      GPU_ALLOW_SECONDARY: ${GPU_ALLOW_SECONDARY:-false}
      AUDIO_ELASTIC_MIN_FREE_VRAM_MB: ${AUDIO_ELASTIC_MIN_FREE_VRAM_MB:-2500}
    gpus: all
    depends_on:
      rabbitmq: {condition: service_healthy}
      audio-worker-elastic: {condition: service_healthy}
    networks: [toeic-network]
