# Opt-in asynchronous ASR; original synchronous /v1/transcribe remains available.
services:
  asr-job-api:
    build: {context: ., dockerfile: services/asr-jobs/Dockerfile}
    restart: unless-stopped
    environment:
      MONGO_URI: ${DOCKER_MONGO_URI:-mongodb://mongo:27017/english-platform}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL}
      JOB_INTERNAL_TOKEN: ${JOB_INTERNAL_TOKEN:?Set JOB_INTERNAL_TOKEN}
      S3_ENDPOINT: ${ASR_S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-vocalearn-media}
    depends_on:
      mongo: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_started}
    networks: [toeic-network]
  asr-job-runner:
    build: {context: ., dockerfile: services/asr-jobs/Dockerfile}
    command: ["python", "worker.py"]
    restart: unless-stopped
    environment:
      MONGO_URI: ${DOCKER_MONGO_URI:-mongodb://mongo:27017/english-platform}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL}
      JOB_INTERNAL_TOKEN: ${JOB_INTERNAL_TOKEN:?Set JOB_INTERNAL_TOKEN}
      S3_ENDPOINT: ${ASR_S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-vocalearn-media}
      ASR_SERVICE_URL: http://asr-service:8002
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      GPU_SCHEDULER_ENABLED: ${GPU_SCHEDULER_ENABLED:-false}
      GPU_NODE_ID: ${GPU_NODE_ID:-server-a}
      GPU_MAX_CONCURRENT: ${GPU_MAX_CONCURRENT:-1}
    depends_on:
      rabbitmq: {condition: service_healthy}
      asr-service: {condition: service_started}
    networks: [toeic-network]
  media-jobs-service:
    environment:
      ASR_JOB_API_URL: http://asr-job-api:8021
    depends_on:
      asr-job-api: {condition: service_started}
