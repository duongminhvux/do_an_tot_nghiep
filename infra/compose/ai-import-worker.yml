# RabbitMQ-backed Qwen inference (one consumer). Apply after docker-compose.ai.yml
# Requires infra/compose/rabbitmq.yml and the same persistent PDF-AI assets.
services:
  pdf-ai:
    environment:
      PDF_AI_QUEUE_BACKEND: rabbitmq
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL}
    depends_on:
      rabbitmq: {condition: service_healthy}
  pdf-ai-worker:
    build:
      context: .
      dockerfile: services/pdf-ai/Dockerfile
    command: ["python", "worker.py"]
    restart: unless-stopped
    environment:
      PDF_AI_QUEUE_BACKEND: rabbitmq
      RABBITMQ_URL: ${RABBITMQ_URL:?Set RABBITMQ_URL}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      GPU_SCHEDULER_ENABLED: ${GPU_SCHEDULER_ENABLED:-false}
      GPU_NODE_ID: ${GPU_NODE_ID:-server-a}
      GPU_MAX_CONCURRENT: ${GPU_MAX_CONCURRENT:-1}
      AI_IMPORT_MAX_RETRIES: ${AI_IMPORT_MAX_RETRIES:-2}
      PDF_AI_ASSET_DIR: /app/assets
      PDF_AI_LEARNING_DIR: /app/learning
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - ./storage/pdf-ai:/app/assets
      - ./.local/pdf-ai-learning:/app/learning
    depends_on:
      rabbitmq: {condition: service_healthy}
      ollama: {condition: service_started}
    networks: [toeic-network]
