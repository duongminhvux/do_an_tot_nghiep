# DEPLOYMENT MODE: combine with base + storage + RabbitMQ overlays.
# No internal service is published on the host. Gateway owns public port :5000.
services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_PUBLISHED_PORT:-5000}:5000"
    depends_on:
      identity-service: {condition: service_healthy}
      content-service: {condition: service_healthy}
      assessment-service: {condition: service_healthy}
      arena-service: {condition: service_healthy}
      learning-service: {condition: service_healthy}
      media-jobs-service: {condition: service_healthy}
      ai-import-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
    networks: [toeic-network]
  api:
    command: ["node", "apps/api/dist/service-main.js"]
    environment:
      SERVICE_ROLE: legacy
      PORT: "5000"
      MONGOOSE_AUTO_INDEX: "false"
  identity-service:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/service-main.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_ROLE: identity
      PORT: "5000"
      MONGO_URI: ${DOCKER_MONGO_URI:-mongodb://mongo:27017/english-platform}
      MONGOOSE_AUTO_INDEX: "false"
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
      MEDIA_STORAGE_PATH: /app/storage
      MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-local}
      MEDIA_BRIDGE_URL: http://media-bridge:8010
      MEDIA_INTERNAL_TOKEN: ${MEDIA_INTERNAL_TOKEN:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:5000/media}
      IDENTITY_INTERNAL_TOKEN: ${IDENTITY_INTERNAL_TOKEN:?Set IDENTITY_INTERNAL_TOKEN}
      IDENTITY_INTROSPECTION_URL: http://identity-service:5000/api/_internal/identity/introspect
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-15m}
      JWT_REFRESH_TOKEN_EXPIRES: ${JWT_REFRESH_TOKEN_EXPIRES:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:5000/api/auth/google/callback}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Daily English}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      TTS_SERVICE_URL: ${DOCKER_TTS_SERVICE_URL:-http://tts-service:8001}
      ASR_SERVICE_URL: ${DOCKER_ASR_SERVICE_URL:-http://asr-service:8002}
      PDF_AI_URL: ${DOCKER_PDF_AI_URL:-http://pdf-ai:8003}
      AUDIO_QUEUE_BACKEND: rabbitmq
      RABBIT_JOB_BROKER_URL: http://job-broker:8020
      JOB_INTERNAL_TOKEN: ${JOB_INTERNAL_TOKEN:?Set JOB_INTERNAL_TOKEN}
    volumes:
      - ./storage:/app/storage
    depends_on:
      db-migrate: {condition: service_completed_successfully}
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 6
    networks: [toeic-network]
  content-service:
