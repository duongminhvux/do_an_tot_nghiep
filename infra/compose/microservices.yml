      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 6
    networks: [toeic-network]
  notification-service:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/service-main.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVICE_ROLE: notification
      PORT: "5000"
      MONGO_URI: ${DOCKER_MONGO_URI:-mongodb://mongo:27017/english-platform}
