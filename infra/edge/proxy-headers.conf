proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
# Drop arbitrary client-supplied chains at the ingress trust boundary.
# This records the connector peer; real visitor IP requires a separate trusted-IP policy.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Request-Id $request_id;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $edge_connection_upgrade;
