# Development-only Compose stack. Supply production secrets through a separate
# deployment configuration; these local defaults must never be used in production.
name: listenup

x-api-environment: &api-environment
  NODE_ENV: development
  DATABASE_URL: postgresql://${POSTGRES_USER:-listenup}:${POSTGRES_PASSWORD:-listenup_dev_password}@postgres:5432/${POSTGRES_DB:-listenup}?schema=public
  API_PORT: 4000
  CORS_ORIGINS: http://localhost:3000,http://localhost:3001
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-listenup-compose-access-secret-change-before-production}
  JWT_ACCESS_EXPIRES_IN: 15m
  REFRESH_TOKEN_EXPIRES_IN: 7d
  COOKIE_SECURE: "false"
  MEDIA_ROOT: /workspace/storage/media
  MEDIA_PUBLIC_BASE_URL: http://localhost:4000/api/v1/media
  TTS_ENABLED: ${TTS_ENABLED:-true}
  TTS_PROVIDER: ${TTS_PROVIDER:-kokoro}
  KOKORO_TTS_URL: http://tts-service:8001
  KOKORO_TTS_TIMEOUT_MS: ${KOKORO_TTS_TIMEOUT_MS:-180000}
  RESET_URL_BASE: http://localhost:3000/reset-password
  ADMIN_RESET_URL_BASE: http://localhost:3001/reset-password

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-listenup}
      POSTGRES_USER: ${POSTGRES_USER:-listenup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-listenup_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # PostgreSQL executes these files, in lexical order, only when the data
      # directory is empty. database.sql is the schema source of truth; seed.sql
      # then inserts the development dataset.
      - ./sql/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-listenup} -d ${POSTGRES_DB:-listenup}",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - listenup-network

  tts-service:
    build:
      context: .
      dockerfile: services/tts-service/Dockerfile
    environment:
      KOKORO_DEVICE: ${KOKORO_DEVICE:-cuda}
      KOKORO_MODEL_ID: ${KOKORO_MODEL_ID:-hexgrad/Kokoro-82M}
      HF_HOME: /models/huggingface
    volumes:
      - tts_model_cache:/models/huggingface
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4).read()\"",
        ]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10
    restart: unless-stopped
    networks:
      - listenup-network

  db-prepare:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-listenup_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./sql:/workspace/sql:ro
    command:
      - /bin/sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 \
          -h postgres \
          -U "${POSTGRES_USER:-listenup}" \
          -d "${POSTGRES_DB:-listenup}" \
          -f /workspace/sql/compat.sql
        psql -v ON_ERROR_STOP=1 \
          -h postgres \
          -U "${POSTGRES_USER:-listenup}" \
          -d "${POSTGRES_DB:-listenup}" \
          -f /workspace/sql/verify.sql
    restart: "no"
    networks:
      - listenup-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-environment
    depends_on:
      db-prepare:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    volumes:
      - media_data:/workspace/storage/media
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:4000/health/ready'').then(r=>{if(!r.ok)process.exit(1)})"',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - listenup-network

  user-web:
    build:
      context: .
      dockerfile: apps/user-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        NEXT_PUBLIC_USE_MOCK_API: "false"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - listenup-network

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
        NEXT_PUBLIC_USE_MOCK_API: "false"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - listenup-network

volumes:
  postgres_data:
  media_data:
  tts_model_cache:

networks:
  listenup-network:
    name: listenup-network
    driver: bridge
