# Add to either docker-compose.yml or compose.infra.yml for CUDA ASR only.
services:
  asr-service:
    build:
      dockerfile: services/asr-service/Dockerfile.gpu
    environment:
      ASR_DEVICE: cuda
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-float16}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
