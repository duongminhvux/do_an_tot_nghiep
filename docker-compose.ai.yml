# Use with docker-compose.yml. The Ollama volume keeps downloaded models.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NO_CLOUD: "true"
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - toeic-network

  pdf-ai:
    build:
      context: .
      dockerfile: services/pdf-ai/Dockerfile
    restart: unless-stopped
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      PDF_AI_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:5000/media}/pdf-ai
      PDF_AI_LEARNING_DIR: /app/learning
    volumes:
      - ./storage/pdf-ai:/app/assets
      - ./.local/pdf-ai-learning:/app/learning
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      - ollama
    networks:
      - toeic-network

  api:
    environment:
      PDF_AI_URL: http://pdf-ai:8003

volumes:
  ollama_models:
